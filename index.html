<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Poker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Texas Hold'em proti botům přímo v prohlížeči. Bez registrace, bez serveru.">
  <title>Poker – Texas Hold'em proti botům</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="screenStart" class="screen start-screen">
    <div class="start-card">
      <div class="start-logo" aria-hidden="true">♠ ♥ ♦ ♣</div>
      <h1>Texas Hold'em</h1>
      <p class="start-tagline">Proti botům, kteří nikdy nepláčou. Ale občas blufují.</p>

      <form id="startForm" autocomplete="off">
        <label for="playerName" class="form-label">Tvoje jméno u stolu</label>
        <input id="playerName" class="form-control form-control-lg mb-3" type="text" maxlength="16" placeholder="Hráč" enterkeyhint="done">

        <div class="form-label">Počet botů</div>
        <div id="botCountGroup" class="btn-group w-100 mb-4" role="group" aria-label="Počet botů"></div>

        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Začít hru</button>
        <button type="button" id="btnContinue" class="btn btn-outline-light btn-lg w-100 mt-2" hidden></button>
      </form>

      <div id="startStats" class="start-stats" hidden></div>
    </div>
  </main>

  <div id="screenGame" class="screen game-screen" hidden>
    <header class="topbar">
      <button id="btnMenu" class="btn btn-sm btn-outline-light" type="button" aria-label="Menu">☰ Menu</button>
      <div id="blindInfo" class="blind-info" aria-live="polite"></div>
      <button id="btnLog" class="btn btn-sm btn-outline-light d-lg-none" type="button">Log</button>
    </header>

    <div class="game-layout">
      <section class="table-column">
        <div id="tableArea" class="table-area" aria-label="Pokerový stůl"></div>
        <div id="ticker" class="ticker" aria-live="polite"></div>

        <section id="actionPanel" class="action-panel">
          <div id="banner" class="banner" hidden></div>
          <div id="panelStatus" class="panel-status"></div>
          <div id="raiseBox" class="raise-box" hidden>
            <div class="raise-presets">
              <button type="button" class="btn btn-sm btn-outline-light" data-preset="min">Min</button>
              <button type="button" class="btn btn-sm btn-outline-light" data-preset="half">½ potu</button>
              <button type="button" class="btn btn-sm btn-outline-light" data-preset="pot">Pot</button>
              <button type="button" class="btn btn-sm btn-outline-danger" data-preset="allin">All-in</button>
            </div>
            <div class="raise-slider-row">
              <button type="button" id="btnRaiseMinus" class="btn btn-outline-light btn-sm" aria-label="Méně">−</button>
              <input id="raiseSlider" class="form-range" type="range" min="0" max="100" step="1" value="0" aria-label="Výše sázky">
              <button type="button" id="btnRaisePlus" class="btn btn-outline-light btn-sm" aria-label="Více">+</button>
            </div>
          </div>
          <div id="actionButtons" class="action-buttons">
            <button type="button" id="btnFold" class="btn btn-danger">Složit</button>
            <button type="button" id="btnCall" class="btn btn-success">Čekat</button>
            <button type="button" id="btnRaise" class="btn btn-warning">Přihodit</button>
          </div>
          <button type="button" id="btnNext" class="btn btn-warning btn-lg w-100 fw-bold" hidden>Další ruka ▶</button>
        </section>
      </section>

      <aside id="logPanel" class="log-panel">
        <div class="log-head">
          <strong>Průběh hry</strong>
          <button type="button" id="btnLogClose" class="btn-close btn-close-white d-lg-none" aria-label="Zavřít"></button>
        </div>
        <ol id="logList" class="log-list"></ol>
      </aside>
    </div>
  </div>

  <div class="modal fade" id="menuModal" tabindex="-1" aria-labelledby="menuTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content poker-modal">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="menuTitle">Menu</h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Zavřít"></button>
        </div>
        <div class="modal-body">
          <h3 class="fs-6 text-uppercase text-secondary">Nastavení</h3>
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="optFast">
            <label class="form-check-label" for="optFast">Rychlejší boti (kratší přemýšlení)</label>
          </div>
          <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" id="optAutoNext">
            <label class="form-check-label" for="optAutoNext">Automaticky rozdat další ruku</label>
          </div>
          <h3 class="fs-6 text-uppercase text-secondary">Statistiky</h3>
          <dl id="statsList" class="stats-list"></dl>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnNewGame" class="btn btn-warning fw-bold">Nová hra (jméno a boti)</button>
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Zpět ke stolu</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="endModal" tabindex="-1" aria-labelledby="endTitle" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content poker-modal text-center">
        <div class="modal-body p-4">
          <div id="endEmoji" class="end-emoji" aria-hidden="true"></div>
          <h2 id="endTitle" class="fs-4"></h2>
          <p id="endText" class="mb-4"></p>
          <div class="d-grid gap-2">
            <button type="button" id="btnRebuy" class="btn btn-warning btn-lg fw-bold">Rebuy</button>
            <button type="button" id="btnEndNewGame" class="btn btn-outline-light">Nová hra</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/engine/deck.js"></script>
  <script src="js/engine/evaluator.js"></script>
  <script src="js/engine/pots.js"></script>
  <script src="js/engine/game.js"></script>
  <script src="js/engine/bots.js"></script>
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/storage.js"></script>
  <script src="js/ui/messages.js"></script>
  <script src="js/ui/tableView.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
