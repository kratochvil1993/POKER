<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testy – Poker</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; background: #111; color: #eee; }
    h1 { font-size: 1.2rem; }
    .summary { padding: .5rem .75rem; border-radius: 6px; font-weight: 600; margin-bottom: 1rem; }
    .summary.pass { background: #14532d; }
    .summary.fail { background: #7f1d1d; }
    ul { list-style: none; padding: 0; margin: 0; font-size: .9rem; }
    li { padding: .25rem 0; border-bottom: 1px solid #222; }
    li.ok::before { content: "✔ "; color: #4ade80; }
    li.fail::before { content: "✘ "; color: #f87171; }
    .err { color: #fca5a5; font-family: monospace; display: block; margin-left: 1.2rem; }
  </style>
</head>
<body>
  <h1>Testy herní logiky</h1>
  <div id="summary" class="summary"></div>
  <ul id="results"></ul>
  <script src="tests/harness.js"></script>
  <script src="js/engine/deck.js"></script>
  <script src="js/engine/evaluator.js"></script>
  <script src="js/engine/pots.js"></script>
  <script src="js/engine/game.js"></script>
  <script src="js/engine/bots.js" onerror="void 0"></script>
  <script src="tests/evaluator.test.js"></script>
  <script src="tests/pots.test.js"></script>
  <script src="tests/game.test.js"></script>
  <script src="tests/bots.test.js" onerror="void 0"></script>
  <script>
    const results = TestHarness.runAll();
    const failed = results.filter((r) => !r.ok).length;
    const summary = document.getElementById('summary');
    summary.textContent = (results.length - failed) + '/' + results.length + ' testů prošlo';
    summary.className = 'summary ' + (failed ? 'fail' : 'pass');
    const list = document.getElementById('results');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'fail';
      li.textContent = r.name;
      if (!r.ok) {
        const err = document.createElement('span');
        err.className = 'err';
        err.textContent = r.error;
        li.appendChild(err);
      }
      list.appendChild(li);
    }
  </script>
</body>
</html>
